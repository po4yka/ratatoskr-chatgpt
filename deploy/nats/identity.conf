# The ChatGPT archive service's own stanza of the one reviewed NATS authorization file,
# `ratatoskr-platform/deploy/nats/ratatoskr.conf`, which is authoritative. This copy exists for the
# authorized-broker test, and the workspace check fails when the two diverge once comments,
# whitespace and the nkey token are ignored (XR-021 CONTRACTS.md sections S03 and R3-01). Do not
# merge it into a host file by hand.
#
# Only the non-secret public-nkey placeholder is replaced at deployment. The seed stays in
# `/etc/ratatoskr/chatgpt.nkey` and is named by `RATATOSKR__RECEIPT__EVENT_BUS_NKEY_SEED_PATH`.
#
# The service publishes its operation report, the eight archive fact subjects and, to ask Edge to
# erase the stream copies of the facts a deletion removed, `cmd.platform.stream_erasure.requested.v1`
# (XR-021 CONTRACTS.md R5-12; no stream-management permission is granted). It consumes
# only its own Edge-provisioned durable `ratatoskr_chatgpt_deletion_acks` of Knowledge's deletion
# acknowledgements (XR-021 CONTRACTS.md R5-11): the three `$JS` subjects below let it inspect,
# fetch from and acknowledge that durable and no other. It subscribes only to its own inbox prefix `_INBOX_chatgpt`, which the service sets with
# `custom_inbox_prefix` in `crates/chatgpt-archive/src/receipt/outbox.rs`; a service built without
# the prefix never receives a publish acknowledgement under this stanza. A denied publish is visible
# only in the NATS server log as a `Publish Violation`.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_CHATGPT_XXXXX
    permissions: {
        publish: {
            allow: [
                "evt.ai-archive.chatgpt.operation.reported.v1",
                "evt.ai_archive.archive.imported.v1",
                "evt.ai_archive.conversation.added.v1",
                "evt.ai_archive.conversation.updated.v1",
                "evt.ai_archive.project.added.v1",
                "evt.ai_archive.project.updated.v1",
                "evt.ai_archive.artifact.added.v1",
                "evt.ai_archive.artifact.updated.v1",
                "evt.ai_archive.subject.tombstoned.v1",
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_chatgpt_deletion_acks",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_chatgpt_deletion_acks",
                "$JS.ACK.ratatoskr_events.ratatoskr_chatgpt_deletion_acks.>",
                "cmd.platform.stream_erasure.requested.v1",
            ]
        }
        subscribe: { allow: ["_INBOX_chatgpt.>"] }
    }
}
